name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # O shell do flake traz o Node LTS, o tsc e os tipos do Node, fixados pelo flake.lock.
      - name: Tests
        run: nix develop -c node --test plugins/moiras/scripts/*.test.ts
      - name: Types
        run: nix develop -c tsc -p tsconfig.json

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Validate plugin and marketplace
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate plugins/moiras
          claude plugin validate .
